name: Sync Canonical Teams

on:
  schedule:
    - cron: '15 */6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run reconciliation without mutating target teams'
        required: false
        type: boolean
        default: false
      allow_empty:
        description: 'Allow empty source teams without tripping circuit breaker'
        required: false
        type: boolean
        default: false
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/sync-teams.yml'

permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Run unit and contract tests
        run: python3 -m unittest discover -s tests -v

  sync:
    needs: [test]
    if: github.event_name != 'pull_request'
    concurrency:
      group: sync-canonical-teams
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Reconcile Canonical teams to Charmed Kubernetes
        env:
          CANONICAL_ORG_READ_TOKEN: ${{ secrets.CANONICAL_ORG_READ_TOKEN }}
          CK8S_ORG_SYNC_TOKEN: ${{ secrets.CK8S_ORG_SYNC_TOKEN }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_ALLOW_EMPTY: ${{ inputs.allow_empty }}
        run: |-
          if [ -z "$CANONICAL_ORG_READ_TOKEN" ] || [ -z "$CK8S_ORG_SYNC_TOKEN" ]; then
            echo "::error::Missing required secret(s) for team reconciliation."
            echo "Ensure both CANONICAL_ORG_READ_TOKEN and CK8S_ORG_SYNC_TOKEN are configured in repository secrets." >&2
            echo "Required setup:" >&2
            echo "  - CANONICAL_ORG_READ_TOKEN: fine-grained PAT with read access to canonical org members and teams" >&2
            echo "  - CK8S_ORG_SYNC_TOKEN: fine-grained PAT with admin/write access to charmed-kubernetes org teams" >&2
            exit 1
          fi

          ARGS=(--source-org canonical --target-org charmed-kubernetes --teams kubernetes kubernetes-admins)
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          if [ "$INPUT_ALLOW_EMPTY" = "true" ]; then
            ARGS+=(--allow-empty)
          fi

          python3 scripts/sync_teams.py "${ARGS[@]}"
